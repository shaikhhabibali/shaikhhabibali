name: Profile Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate contribution graph
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: shaikhhabibali
          cards: lifetime
          output-dir: assets
          themes: light,dark
          commit: true
          commit-message: "chore(profile): refresh contribution graph [skip ci]"
