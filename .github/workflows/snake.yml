name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: shaikhhabibali
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Commit generated snake
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(profile): refresh contribution snake [skip ci]"
          file_pattern: "assets/github-snake.svg assets/github-snake-dark.svg"
